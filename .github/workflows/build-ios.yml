name: Build iOS (unsigned)

# Unsigned .ipa for AltStore sideloading (free Apple ID, no $99 Developer
# Program, no certificates) and for smoke-testing the store-bound Capacitor
# wrapper before submission.
#
# The committed www/index.html is ALREADY wrapped + transformed on the dev VM
# (live mobile + asset-URL transform + native-auth transform + BridgePlayer
# transform) — this workflow only syncs it into the iOS project and builds.
# Do NOT re-run the transforms here.
#
# Notes:
# - The real store icon (AppIcon-512@2x.png) IS committed in this repo; the
#   placeholder step below only writes files that are MISSING, it never
#   overwrites the real icon/splash.
# - Native login needs GoogleService-Info.plist (Firebase Console, bundle
#   com.sorakanji.app) in ios/App/App/. WITHOUT it the build still succeeds
#   and the app still launches — the Firebase plugin logs "GoogleService-
#   Info.plist is missing" and native Google/Apple sign-in calls fail
#   gracefully; everything else (incl. the WebView app) works. Add the plist
#   to test native login.
# - Trigger is workflow_dispatch ONLY: pushes to main must not burn macOS
#   minutes or publish a release per commit.
on:
  workflow_dispatch:

permissions:
  contents: write # needed to publish the .ipa as a release asset

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Only generate placeholder PNGs for asset-catalog files that are
      # MISSING. The real app icon + splash are committed in this repo and
      # must never be overwritten (an earlier version of this step wrote
      # solid-red placeholders unconditionally).
      - name: Generate placeholder images (only if missing)
        run: |
          python3 - <<'EOF'
          import os, struct, zlib
          def png(w, h, rgb):
              def chunk(t, data):
                  c = struct.pack('>I', len(data)) + t + data
                  return c + struct.pack('>I', zlib.crc32(t + data) & 0xffffffff)
              ihdr = struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)
              raw = b''.join(b'\x00' + bytes(rgb) * w for _ in range(h))
              return (b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr)
                      + chunk(b'IDAT', zlib.compress(raw, 6)) + chunk(b'IEND', b''))
          red = (192, 57, 43)
          base = 'ios/App/App/Assets.xcassets'
          targets = [(f'{base}/AppIcon.appiconset/AppIcon-512@2x.png', 1024, 1024)]
          for n in ('splash-2732x2732.png', 'splash-2732x2732-1.png', 'splash-2732x2732-2.png'):
              targets.append((f'{base}/Splash.imageset/{n}', 2732, 2732))
          for path, w, h in targets:
              if os.path.exists(path):
                  print(f'keep existing {path}')
              else:
                  open(path, 'wb').write(png(w, h, red))
                  print(f'placeholder written {path}')
          EOF

      - run: npm ci

      - run: npx cap sync ios

      # Fail fast if the sync lost the wrapped code. Markers of the current
      # wrap (live mobile + 3 transforms): native-auth helper, Firebase
      # plugin bridge, BridgePlayer (YouTube error-153 bridge), githack
      # asset URLs. (The old check grepped svuNativeCaptions, which no
      # longer exists in the wrapped file.)
      - name: Verify wrapped code synced
        run: |
          F=ios/App/App/public/index.html
          grep -q 'skIsNativeApp' "$F" && echo 'ok: native-auth helper'
          grep -q 'FirebaseAuthentication' "$F" && echo 'ok: Firebase plugin bridge'
          grep -q 'BRIDGEPLAYER-TRANSFORM' "$F" && echo 'ok: BridgePlayer'
          grep -q 'raw.githack.com/donghung94/beta2.0/main/mobile/assets/' "$F" && echo 'ok: githack asset URLs'

      - name: Archive (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r App-unsigned.ipa Payload
          ls -la App-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: App-unsigned.ipa
          path: App-unsigned.ipa
          if-no-files-found: error

      # Publish as a release asset too, so the .ipa can be downloaded without
      # GitHub authentication (workflow artifacts need auth).
      - name: Publish release
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" App-unsigned.ipa \
            --title "Unsigned build $TAG" \
            --notes "Unsigned .ipa for AltStore sideloading (free Apple ID). Built from ${{ github.sha }}. Expires after 7 days on device; AltStore refreshes it automatically."
        env:
          GH_TOKEN: ${{ github.token }}
